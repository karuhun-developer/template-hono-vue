# Base compose: only the dependencies the API needs. The Node apps themselves run on
# the host during development — hot reload through tsx/vite is far nicer outside a
# container.
#
# Never run this file on its own — always pair it with an overlay:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# or use `make up`, which already chains them.

name: app

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Behind a profile, so `make up` stays a one-container stack: the default drivers are
  # `database` for the queue and `memory` for the cache, and neither needs this. `make
  # up-redis` starts it for whoever has switched a driver over.
  redis:
    image: redis:8-alpine
    profiles: ['redis']
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
